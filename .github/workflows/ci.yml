name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Pruebas del motor financiero
        run: ./gradlew :core:test --no-daemon
      - name: Compilar APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CuentasClaras-0.2.${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: CuentasClaras-*.apk
      - name: Publicar versión (para descargar e instalar)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.2.${{ github.run_number }}" CuentasClaras-0.2.${{ github.run_number }}.apk \
            --title "Cuentas Claras 0.2.${{ github.run_number }}" \
            --notes "Compilación automática de la fase 2." --prerelease
      - name: Informe de pruebas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informes
          path: |
            core/build/reports/tests/
            app/build/reports/
