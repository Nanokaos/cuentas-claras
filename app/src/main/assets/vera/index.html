<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vera</title>
<style>
:root { --accent: #ff4fd8; --warn: #ffb347; --line: #2c2444; --raise: #1c1630; --text: #eee9f7; color-scheme: dark; }
html, body { margin: 0; height: 100%; background: #07050d; color: var(--text); font-family: system-ui, "Roboto", sans-serif; overflow: hidden; }
.stage { position: absolute; inset: 0; touch-action: manipulation; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.stage::after { content: ""; position: absolute; inset: auto 0 0; height: 36px; background: linear-gradient(rgba(13,10,23,0), #0d0a17); pointer-events: none; }
.bubble { position: absolute; top: 40px; left: 12px; width: 200px; z-index: 3; background: rgba(18,13,32,.88); border: 1px solid rgba(255,79,216,.5); border-radius: 14px; padding: 10px 12px; font-size: 14px; line-height: 1.42; box-shadow: 0 8px 30px rgba(0,0,0,.5); opacity: 0; transform: translateY(4px); transition: opacity .25s, transform .25s, border-color .4s; pointer-events: none; }
.bubble.show { opacity: 1; transform: none; }
.bubble.alert { border-color: rgba(255,176,64,.75); }
.bubble .who { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin-bottom: 3px; font-weight: 600; }
.bubble.alert .who { color: var(--warn); }
.bubble .actions { display: flex; gap: 8px; margin-top: 8px; }
.bubble .actions button { pointer-events: auto; font: inherit; color: inherit; border: 1px solid var(--line); background: var(--raise); border-radius: 999px; padding: 6px 14px; font-size: 14px; }
.bubble .actions button.primary { background: var(--accent); border-color: var(--accent); color: #1a0718; font-weight: 600; }
.cursor::after { content: "▍"; color: var(--accent); animation: bl 1s steps(2) infinite; }
@keyframes bl { 50% { opacity: 0; } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.fallback { position: absolute; inset: 0; display: grid; place-items: center; color: #a49cbd; font-size: 14px; padding: 20px; text-align: center; }
</style>
<script type="importmap">{ "imports": { "three": "./three/build/three.module.js", "three/addons/": "./three/examples/jsm/" } }</script>
</head><body>
<div class="stage" id="stage">
  <canvas id="scene" role="img" aria-label="Vera, la asistente"></canvas>
  <div class="bubble" id="bubble"><div class="who" id="who">Vera</div><div id="bubbleText"></div><div class="actions" id="bubbleActions"></div></div>
</div>
<div class="sr" aria-live="polite" id="live"></div>
<script type="module">
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

const $ = (s) => document.querySelector(s);
const stage = $("#stage"), canvas = $("#scene"), bubble = $("#bubble"), bubbleText = $("#bubbleText"), bubbleActions = $("#bubbleActions"), live = $("#live");
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const mix = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${clamp(a, 0, 1)})`;
const mixc = (a, b, t) => [mix(a[0], b[0], t), mix(a[1], b[1], t), mix(a[2], b[2], t)];
const fmt = new Intl.NumberFormat("es-ES", { style: "currency", currency: "EUR" });
const m = (cents) => fmt.format(cents / 100);

// ================= Personalidad (las frases de finanzas llegan desde la app) =================
let sarcasm = 2, remarks = [];
const L = (v) => v[sarcasm] ?? v[v.length - 1];
const lines = {
  poke: [
    () => L([`Hola. Pulsa el micrófono para hablar conmigo.`, `Ese es mi sensor óptico. El micrófono está abajo.`, `Eso es mi sensor óptico, no un botón. Para hablar conmigo, el micrófono de abajo.`, `Sensor óptico. No botón. Aprendemos juntos.`]),
    () => L([`¿Necesitas algo? Estoy aquí.`, `Sigo aquí.`, `Otra vez. Fascinante. Si quieres atención, registra un gasto.`, `Otra vez. Tu insistencia sería admirable aplicada al ahorro.`]),
    () => L([`Puedo ayudarte con tus cuentas cuando quieras.`, `Tres toques. Muy bien.`, `Tres toques. Lo anoto en tu expediente, junto a tus suscripciones.`, `Tres. Lo apunto. Tengo muy buena memoria y mucho espacio.`]),
  ],
  wake: () => L([`Aquí estoy.`, `Aquí sigo.`, `¿Hmm? Ah, eres tú. Tu saldo y yo seguíamos aquí.`, `Estaba descansando. Tú también, por lo visto, de mirar tus cuentas.`]),
};
const bridge = window.AndroidVera || { onPoke() {}, onTap() {}, onAction() {} };

// ================= Expresión =================
const C = { magenta: [255, 79, 216], hot: [255, 120, 232], violet: [146, 98, 255], cyan: [86, 222, 255], amber: [255, 176, 64], red: [255, 72, 96], rose: [255, 140, 205] };
const BASE = { color: C.magenta, color2: C.violet, lidTop: .16, lidBot: .08, lidTilt: 0, lowerCurve: .05, iris: 1, pupil: 1, glow: .8, reach: 1, tilt: 0, pitchBias: 0, spin: .35 };
const STATES = {
  reposo: {},
  atencion: { color: C.hot, lidTop: .03, lidBot: .02, iris: 1.12, glow: 1, reach: 1.16 },
  escucha: { color: C.cyan, color2: C.violet, lidTop: .05, lidBot: .03, iris: 1.06, glow: .95, reach: 1.12, tilt: .16 },
  pensando: { color: C.violet, color2: C.magenta, lidTop: .24, lidBot: .12, iris: .88, glow: .85, reach: .97, spin: 3.2 },
  habla: { reach: 1.06, lidTop: .12, lidBot: .06 },
  aviso: { color: C.amber, color2: C.red, lidTop: .3, lidBot: .12, lidTilt: -.14, iris: .76, glow: 1.1, reach: 1.1 },
};
const MOODS = {
  neutral: {},
  contenta: { color: C.rose, lidTop: .1, lidBot: .38, lowerCurve: .48, iris: 1.08, tilt: .1 },
  sarcastica: { lidTop: .45, lidBot: .16, lidTilt: .17, iris: .86, tilt: -.13 },
  decepcionada: { lidTop: .46, lidBot: .12, lidTilt: -.05, iris: .82, pitchBias: .3, glow: .62, reach: .96 },
  enfadada: { lidTop: .4, lidBot: .2, lidTilt: -.22, iris: .66, glow: 1.15 },
  sorprendida: { lidTop: 0, lidBot: 0, iris: .58, reach: .93 },
  dormida: { lidTop: .9, lidBot: .3, lowerCurve: 0, iris: .82, glow: .12, pitchBias: .55, reach: .9, tilt: .22, spin: .05 },
};
const E = { ...BASE, color: [...C.magenta], color2: [...C.violet] };
let state = "reposo", mood = "neutral", sleeping = false;
const targetExpr = () => { const t = { ...BASE, ...STATES[state], ...MOODS[mood] }; if (state === "aviso") t.color = STATES.aviso.color; return t; };

let RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
let clock = 0, timers = [];
const after = (s, fn) => timers.push({ at: clock + s, fn });
const cancelSeq = () => { timers = []; };
let gestures = [];
const gesture = (type, dur = 1.1) => gestures.push({ type, t0: clock, dur });
let startle = 0, mouth = 0, blink = 0, nextBlink = 2, blinkPhase = -1, doubleBlink = false;
let pointer = { x: 0, y: 0, t: -99 }, focus = null, focusUntil = 0, saccade = { x: 0, y: .12 }, nextSaccade = 1;
let lastInteraction = 0, nextWander = 10, nextRemark = 28, pokes = [], listenLevel = 0;

// ================= Física (unidades del mundo 3D: metros) =================
const G = { railY: 3.72, shoulderY: 3.1, L1: .82, L2: .78, neck: .62, R: .42, minX: -1.5, maxX: 1.55, home: .95, rest: 1.02 };
const P = { tx: G.home, txV: 0, ttx: G.home, wx: G.home, wxV: 0, wy: G.shoulderY - G.rest, wyV: 0, yaw: 0, yawV: 0, pitch: 0, pitchV: 0, roll: 0, rollV: 0, gx: 0, gxV: 0, gy: .1, gyV: 0, elbow: -1, wheel: 0, lean: 0, leanV: 0 };
function spring(o, k, target, stiff, damp, dt) { const v = k + "V"; o[v] += (stiff * (target - o[k]) - damp * o[v]) * dt; o[k] += o[v] * dt; }

function setState(s) { if (!STATES[s]) return; state = s; bubble.classList.toggle("alert", s === "aviso"); }
const setMood = (md) => { mood = md; };
function interact() { lastInteraction = clock; if (sleeping) wakeUp(); }
function wakeUp() { sleeping = false; setMood("sorprendida"); startle = 1; gesture("shake", .5); after(.7, () => { setMood("neutral"); speak(lines.wake(), { mood: sarcasm >= 2 ? "sarcastica" : "neutral" }); }); }
function sleep() { cancelSeq(); hideBubble(); setState("reposo"); setMood("dormida"); sleeping = true; }

// ================= Habla =================
let speech = null;
function speak(text, opts = {}) {
  setMood(opts.mood || "neutral"); setState(opts.state || "habla"); moveAside();
  speech = { text, shown: 0, acc: 0, done: false, opts, holdUntil: 0 };
  bubbleText.textContent = ""; bubbleText.classList.add("cursor"); bubbleActions.innerHTML = ""; bubble.classList.add("show"); live.textContent = text;
}
function hideBubble() { bubble.classList.remove("show"); speech = null; }
function showRaw(text) { speech = null; bubbleText.classList.remove("cursor"); bubbleText.textContent = text; bubbleActions.innerHTML = ""; bubble.classList.add("show"); }
function moveAside() { if (!RM) P.ttx = P.tx > 0 ? G.home : -G.home * .2; }
function updateSpeech(dt) {
  if (!speech) return;
  if (!speech.done) {
    speech.acc += dt * (RM ? 120 : 34);
    while (speech.acc >= 1 && speech.shown < speech.text.length) {
      speech.acc -= 1; const ch = speech.text[speech.shown++];
      if (/[aeiouáéíóú]/i.test(ch)) mouth = Math.min(1, mouth + .75);
      if (ch === "." && !RM) gesture("nod-s", .45);
    }
    bubbleText.textContent = speech.text.slice(0, speech.shown);
    if (speech.shown >= speech.text.length) {
      speech.done = true; bubbleText.classList.remove("cursor");
      const acts = speech.opts.actions;
      if (acts) { acts.forEach((a, i) => { const b = document.createElement("button"); b.textContent = a.label; if (i === 0) b.className = "primary"; b.addEventListener("click", (e) => { e.stopPropagation(); interact(); bridge.onAction(a.id); hideBubble(); }); bubbleActions.appendChild(b); }); speech.holdUntil = Infinity; }
      else speech.holdUntil = clock + Math.max(4.5, speech.text.length / 16);
      if (state === "habla") setState("reposo");
    }
  } else if (clock > speech.holdUntil) {
    hideBubble(); if (state !== "aviso") setState("reposo");
    after(1.2, () => { if (!speech && !sleeping) setMood("neutral"); });
  }
}

// ================= Utilidades de comportamiento =================
const sarc = () => (sarcasm >= 2 ? "sarcastica" : "neutral");
function wander(force) { if (RM && !force) return; let x; do { x = rnd(G.minX, G.maxX); } while (Math.abs(x - P.tx) < .8); P.ttx = x; const hs = headScreen(); focus = { x: hs.x + Math.sign(x - P.tx) * W * .4, y: hs.y }; focusUntil = clock + .9; }

// ================= Entrada =================
const stagePoint = (e) => { const r = stage.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
addEventListener("pointermove", (e) => { pointer = { ...stagePoint(e), t: clock }; interact(); }, { passive: true });
stage.addEventListener("pointerdown", (e) => {
  const p = stagePoint(e); pointer = { ...p, t: clock }; const h = headScreen();
  if (Math.hypot(p.x - h.x, p.y - h.y) < h.r * 1.2) { poke(); bridge.onPoke(); } else { interact(); bridge.onTap(); }
});
function poke() {
  const was = sleeping; interact(); if (was) return;
  cancelSeq(); startle = 1; P.wxV += rnd(-1.4, 1.4); P.leanV -= 2.2; gesture("shake", .6);
  pokes = pokes.filter((t) => clock - t < 6); pokes.push(clock); const n = Math.min(pokes.length, 3);
  setMood("sorprendida"); after(.55, () => speak(lines.poke[n - 1](), { mood: n >= 3 ? "enfadada" : sarc() }));
}

// ================= Escena 3D =================
let W = 0, H = 0;
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" }); }
catch (err) { stage.insertAdjacentHTML("beforeend", '<div class="fallback">Este navegador no puede mostrar gráficos 3D (WebGL). La app usará una versión simplificada.</div>'); throw err; }
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = .85;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07050d);
scene.fog = new THREE.FogExp2(0x0a0714, .055);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), .04).texture;
scene.environmentIntensity = .35;

const camera = new THREE.PerspectiveCamera(38, 1, .05, 120);
const camBase = new THREE.Vector3(.15, 1.72, 4.9), camLook = new THREE.Vector3(.35, 2.18, 0);

// ---------- Texturas procedurales ----------
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
function noise(g, w, h, a) { const img = g.getImageData(0, 0, w, h); for (let i = 0; i < img.data.length; i += 4) { const n = (Math.random() - .5) * a; img.data[i] += n; img.data[i + 1] += n; img.data[i + 2] += n * 1.1; } g.putImageData(img, 0, 0); }
const wallTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = "#24203a"; g.fillRect(0, 0, w, h);
  const panels = [[8, 8, 240, 300], [264, 8, 240, 150], [264, 166, 240, 142], [8, 316, 496, 188]];
  panels.forEach(([x, y, pw, ph], i) => {
    const gr = g.createLinearGradient(x, y, x + pw, y + ph); gr.addColorStop(0, "#3a3456"); gr.addColorStop(1, "#272240");
    g.fillStyle = gr; g.fillRect(x, y, pw, ph);
    g.strokeStyle = "#141022"; g.lineWidth = 4; g.strokeRect(x + 2, y + 2, pw - 4, ph - 4);
    g.strokeStyle = "rgba(255,255,255,.07)"; g.lineWidth = 1; g.strokeRect(x + 6, y + 6, pw - 12, ph - 12);
    g.fillStyle = "#16121f"; [[x + 12, y + 12], [x + pw - 12, y + 12], [x + 12, y + ph - 12], [x + pw - 12, y + ph - 12]].forEach(([bx, by]) => { g.beginPath(); g.arc(bx, by, 3.5, 0, 7); g.fill(); });
    if (i === 3) { for (let k = 0; k < 9; k++) { g.fillStyle = "#151120"; g.fillRect(x + 40 + k * 48, y + 60, 30, 70); g.fillStyle = "rgba(255,255,255,.05)"; g.fillRect(x + 40 + k * 48, y + 60, 30, 2); } }
    if (i === 1) { g.fillStyle = "rgba(180,160,255,.35)"; g.font = "600 22px monospace"; g.fillText("SEC-07", x + 20, y + 44); g.fillStyle = "#c8a03a"; for (let k = 0; k < 8; k++) { g.save(); g.beginPath(); g.rect(x + 20, y + ph - 34, 200, 14); g.clip(); g.fillRect(x + 20 + k * 28, y + ph - 34, 14, 14); g.restore(); } }
  });
  noise(g, w, h, 14);
}, [1, 1]);
const floorTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = "#1a1726"; g.fillRect(0, 0, w, h);
  for (let y = 0; y < 2; y++) for (let x = 0; x < 2; x++) {
    const gr = g.createLinearGradient(x * 256, y * 256, x * 256 + 256, y * 256 + 256); gr.addColorStop(0, "#2a2640"); gr.addColorStop(1, "#1f1b30");
    g.fillStyle = gr; g.fillRect(x * 256 + 4, y * 256 + 4, 248, 248);
    g.strokeStyle = "rgba(255,255,255,.05)"; for (let k = 0; k < 18; k++) { g.beginPath(); g.moveTo(x * 256 + 16 + k * 13, y * 256 + 16); g.lineTo(x * 256 + 16 + k * 13 + 6, y * 256 + 30); g.stroke(); }
  }
  noise(g, w, h, 18);
}, [4, 20]);
const floorEmis = canvasTex(512, 512, (g, w, h) => { g.fillStyle = "#000"; g.fillRect(0, 0, w, h); g.fillStyle = "#3a1238"; g.fillRect(0, 0, w, 3); g.fillRect(0, 0, 3, h); }, [4, 20]);

// ---------- Materiales ----------
const mat = {
  gun: new THREE.MeshPhysicalMaterial({ color: 0x2b2740, metalness: .9, roughness: .3, clearcoat: .5, clearcoatRoughness: .2, envMapIntensity: .55 }),
  plate: new THREE.MeshPhysicalMaterial({ color: 0x55507a, metalness: .85, roughness: .26, clearcoat: .6, envMapIntensity: .6 }),
  chrome: new THREE.MeshStandardMaterial({ color: 0xc8c4dc, metalness: 1, roughness: .16, envMapIntensity: .7 }),
  dark: new THREE.MeshStandardMaterial({ color: 0x0c0a12, metalness: .4, roughness: .7 }),
  rubber: new THREE.MeshStandardMaterial({ color: 0x141018, metalness: .1, roughness: .85 }),
  glow: new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0xff4fd8, emissiveIntensity: 3 }),
  wall: new THREE.MeshStandardMaterial({ map: wallTex, metalness: .55, roughness: .55, envMapIntensity: .5 }),
  steel: new THREE.MeshStandardMaterial({ color: 0x3b3654, metalness: .85, roughness: .38, envMapIntensity: .7 }),
  pipe: new THREE.MeshStandardMaterial({ color: 0x4a4466, metalness: .9, roughness: .3, envMapIntensity: .8 }),
  floor: new THREE.MeshStandardMaterial({ map: floorTex, emissiveMap: floorEmis, emissive: 0xffffff, emissiveIntensity: 1, metalness: .7, roughness: .32, envMapIntensity: .6 }),
};
const stripMats = [new THREE.MeshStandardMaterial({ color: 0, emissive: 0xff3fd0, emissiveIntensity: 2.6 }), new THREE.MeshStandardMaterial({ color: 0, emissive: 0x7a4dff, emissiveIntensity: 2.6 })];
const lampMat = new THREE.MeshStandardMaterial({ color: 0, emissive: 0xd9ccff, emissiveIntensity: 1.3 });
const add = (parent, geo, material, opts = {}) => { const me = new THREE.Mesh(geo, material); if (opts.p) me.position.set(...opts.p); if (opts.r) me.rotation.set(...opts.r); me.castShadow = opts.cast ?? true; me.receiveShadow = opts.recv ?? true; parent.add(me); return me; };

// ---------- Nave industrial ----------
const room = new THREE.Group(); scene.add(room);
const RW = 4.2, RH = 4.3, Z0 = 3.5, Z1 = -40;
const floor = add(room, new THREE.PlaneGeometry(RW * 2, Z0 - Z1), mat.floor, { r: [-Math.PI / 2, 0, 0], p: [0, 0, (Z0 + Z1) / 2], cast: false });
add(room, new THREE.PlaneGeometry(RW * 2, Z0 - Z1), mat.dark, { r: [Math.PI / 2, 0, 0], p: [0, RH, (Z0 + Z1) / 2], cast: false });
for (let z = Z0, i = 0; z > Z1; z -= 3, i++) {
  for (const s of [-1, 1]) {
    const wall = add(room, new THREE.BoxGeometry(.12, RH, 2.62), mat.wall, { p: [s * (RW - .06), RH / 2, z - 1.5], cast: false });
    add(room, new THREE.BoxGeometry(.42, RH, .38), mat.steel, { p: [s * (RW - .2), RH / 2, z], cast: false });
    add(room, new THREE.BoxGeometry(.5, .3, .46), mat.steel, { p: [s * (RW - .24), .15, z], cast: false });
    add(room, new THREE.BoxGeometry(.05, .05, 2.6), stripMats[(i + (s > 0 ? 1 : 0)) % 2], { p: [s * (RW - .16), .34, z - 1.5], cast: false, recv: false });
    if (i % 2 === 0) add(room, new THREE.BoxGeometry(.04, .9, .05), stripMats[0], { p: [s * (RW - .15), 2.6, z - .25], cast: false, recv: false });
    [3.55, 3.75, 1.35].forEach((y, k) => add(room, new THREE.CylinderGeometry(k === 2 ? .09 : .06, k === 2 ? .09 : .06, 3, 12), mat.pipe, { r: [Math.PI / 2, 0, 0], p: [s * (RW - .42 - k * .12), y, z - 1.5], cast: false }));
    add(room, new THREE.BoxGeometry(.4, .06, .08), mat.steel, { p: [s * (RW - .4), 3.62, z - .6], cast: false });
  }
  add(room, new THREE.BoxGeometry(RW * 2, .32, .3), mat.steel, { p: [0, RH - .16, z], cast: false });
  if (i % 2 === 1) add(room, new THREE.BoxGeometry(1.4, .04, .5), lampMat, { p: [0, RH - .34, z - 1.5], cast: false, recv: false });
}
// compuerta del fondo
const door = new THREE.Group(); door.position.set(0, 0, Z1 + .4); room.add(door);
add(door, new THREE.BoxGeometry(RW * 2, RH, .2), mat.wall, { p: [0, RH / 2, 0], cast: false });
add(door, new THREE.BoxGeometry(2.6, 3, .1), mat.steel, { p: [0, 1.5, .12], cast: false });
for (const [w, h, x, y] of [[2.8, .07, 0, 3.05], [.07, 3, -1.36, 1.5], [.07, 3, 1.36, 1.5]]) add(door, new THREE.BoxGeometry(w, h, .05), stripMats[0], { p: [x, y, .2], cast: false, recv: false });
add(door, new THREE.BoxGeometry(.04, 2.9, .05), stripMats[1], { p: [0, 1.5, .2], cast: false, recv: false });

// haces de luz volumétricos
const shaftMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  uniforms: { uColor: { value: new THREE.Color(0x9c84ff) }, uI: { value: .07 } },
  vertexShader: "varying float vY; varying vec3 vN; varying vec3 vV; void main(){ vY = uv.y; vec4 mv = modelViewMatrix*vec4(position,1.); vN = normalize(normalMatrix*normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix*mv; }",
  fragmentShader: "uniform vec3 uColor; uniform float uI; varying float vY; varying vec3 vN; varying vec3 vV; void main(){ float edge = pow(abs(dot(vN,vV)),1.6); gl_FragColor = vec4(uColor, uI*vY*vY*edge); }",

    spring(P, "roll", E.tilt - P.wxV * .06 + (P.wx - P.tx) * .25, 40, 8, sd);
  }
  gestures = gestures.filter((g) => clock - g.t0 < g.dur);
  P.wheel -= P.txV * dt / .07;
  P.elbow = mix(P.elbow, P.tx > 0 ? -1 : 1, 1 - Math.exp(-dt * 1.5));
  listenLevel = state === "escucha" ? clamp(listenLevel * .82 + (Math.random() < .35 ? rnd(.4, 1) : 0) * .45, 0, 1) : listenLevel * .8;
  updateSpeech(dt);
  for (const k2 in P) if (typeof P[k2] === "number" && !Number.isFinite(P[k2])) P[k2] = 0;

  // polvo
  for (let i = 0; i < dustN; i++) { const v = dustVel[i]; dustPos[i * 3] += v[0] * dt; dustPos[i * 3 + 1] += (v[1] + Math.sin(clock * .3 + i) * .01) * dt; dustPos[i * 3 + 2] += v[2] * dt; if (dustPos[i * 3 + 1] > RH) dustPos[i * 3 + 1] = 0; if (dustPos[i * 3 + 1] < 0) dustPos[i * 3 + 1] = RH; }
  dustGeo.attributes.position.needsUpdate = true;
}

const col3 = new THREE.Color();
function pose() {
  const col = E.color, glow = E.glow * (RM ? 1 : .9 + .1 * Math.sin(clock * 1.6)) + mouth * .3;
  col3.setRGB(col[0] / 255, col[1] / 255, col[2] / 255, THREE.SRGBColorSpace);
  mat.glow.emissive.copy(col3); mat.glow.emissiveIntensity = 1.05 * Math.min(glow, 1);
  eyeLight.color.copy(col3); eyeLight.intensity = 3.2 * glow;
  trolley.position.x = P.tx; wheels.forEach((w) => { w.rotation.z = P.wheel; });
  trolleyLeds.forEach((lm, i) => {
    let a = .35 + .25 * Math.sin(clock * 2 + i * .6);
    if (state === "pensando") a = .2 + 1.2 * Math.max(0, Math.cos(clock * 7 - i * .9));
    if (state === "aviso") a = Math.sin(clock * 9) > 0 ? 1.4 : .2;
    if (state === "escucha") a = .2 + listenLevel * 1.4 * (1 - Math.abs(i - 4) / 5);
    if (sleeping) a = .08 + .1 * (Math.sin(clock * 1.2) + 1);
    lm.emissive.copy(col3); lm.emissiveIntensity = 3 * a;
  });
  sideLeds.forEach(({ lm, i, sgn }) => {
    let lv = .3 + .15 * Math.sin(clock * 1.8 + i);
    if (state === "escucha") lv = listenLevel > i / 5 ? 1.3 : .12;
    else if (speech && !speech.done) lv = mouth > i / 6 ? 1.3 : .2;
    else if (state === "pensando") lv = .2 + Math.max(0, Math.cos(clock * 6 - i * 1.1 + (sgn > 0 ? 0 : Math.PI)));
    else if (state === "aviso") lv = Math.sin(clock * 9) > 0 ? 1.3 : .2;
    if (sleeping) lv = .05;
    lm.emissive.copy(col3); lm.emissiveIntensity = 3 * lv;
  });
  // brazo: IK en el plano local del hombro
  armRoot.position.set(P.tx, G.shoulderY, 0); armRoot.rotation.x = -P.lean;
  const dx = P.wx - P.tx, dy = P.wy - G.shoulderY; let d = Math.hypot(dx, dy);
  const dd = clamp(d, Math.abs(G.L1 - G.L2) + .05, G.L1 + G.L2 - .01), ux = dx / (d || 1), uy = dy / (d || 1);
  const a = (G.L1 ** 2 - G.L2 ** 2 + dd ** 2) / (2 * dd), hh = Math.sqrt(Math.max(0, G.L1 ** 2 - a * a));
  const exx = ux * a - uy * hh * P.elbow, eyy = uy * a + ux * hh * P.elbow, wxx = ux * dd, wyy = uy * dd;
  upper.position.set(0, 0, 0); upper.rotation.z = Math.atan2(exx, -eyy);
  fore.position.set(exx, eyy, 0); fore.rotation.z = Math.atan2(wxx - exx, -(wyy - eyy));
  elbowJ.position.set(exx, eyy, 0);
  const off = .1 * P.elbow, nx1 = -eyy / G.L1, ny1 = exx / G.L1, nx2 = -(wyy - eyy) / G.L2, ny2 = (wxx - exx) / G.L2;
  const p0 = new THREE.Vector3(exx * .25 + nx1 * off, eyy * .25 + ny1 * off, .0), p1 = new THREE.Vector3(mix(exx, wxx, .55) + nx2 * off, mix(eyy, wyy, .55) + ny2 * off, 0);
  const mid = p0.clone().lerp(p1, .55); between(pistonBody, p0, mid); between(pistonRod, mid, p1);
  wrist.position.set(wxx, wyy, 0);
  wrist.rotation.set(P.lean * .9, P.yaw * .9, -P.roll, "YXZ");
  headPivot.rotation.x = P.pitch;
  head.position.set(Math.sin(clock * 37) * (RM || sleeping ? 0 : .0012), Math.cos(clock * 29) * (RM || sleeping ? 0 : .0012), 0);
  head.scale.setScalar(1 - startle * .03);
  head.getWorldPosition(tmpV); eyeLight.position.copy(tmpV).add(new THREE.Vector3(0, -.1, .6));
  // festón
  const anchor = RW - .2, n = 4, tx = P.tx + .5, yb = G.railY - .12, cable = (RW * 2 * .95) / n;
  for (let i = 0; i < n; i++) {
    const xa = mix(anchor, tx, i / n), xb = mix(anchor, tx, (i + 1) / n), span = Math.abs(xb - xa), sag = Math.sqrt(Math.max(0, cable * cable - span * span)) * .38 + .04;
    const pts = []; for (let k = 0; k <= 16; k++) { const t = k / 16; pts.push(new THREE.Vector3(mix(xa, xb, t) - P.txV * .05 * Math.sin(Math.PI * t) * (i + 1) / n, yb - Math.sin(Math.PI * t) * sag, -.2)); }
    festoon[i].geometry.dispose(); festoon[i].geometry = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 24, .022, 6, false);
    carriers[i].position.set(xa, G.railY - .1, -.2);
  }
  // cámara: ligera respiración y paralaje con el puntero
  const px = clock - pointer.t < 4 ? (pointer.x / W - .5) : 0, py = clock - pointer.t < 4 ? (pointer.y / H - .5) : 0;
  camera.position.set(camBase.x + (RM ? 0 : px * .25 + Math.sin(clock * .2) * .05), camBase.y + (RM ? 0 : -py * .12 + Math.sin(clock * .27) * .03), camBase.z);
  camera.lookAt(camLook);
}

function bubbleLayout() {
  if (!bubble.classList.contains("show")) return;
  const h = headScreen(), right = h.x < W / 2, gap = h.r * 1.35 + 12;
  const width = clamp(right ? W - (h.x + gap) - 12 : h.x - gap - 12, 160, 250);
  bubble.style.width = width + "px";
  bubble.style.left = (right ? Math.min(h.x + gap, W - width - 8) : Math.max(8, h.x - gap - width)) + "px";
  const bh = bubble.offsetHeight; bubble.style.top = clamp(h.y - bh * .45, 10, H - bh - 10) + "px";
}


// ================= API para la app =================
window.vera = {
  speak(text, mood = "neutral", st = "habla", actions = null) { cancelSeq(); interact(); speak(text, { mood, state: st, actions }); },
  show(text) { showRaw(text); },
  hide() { hideBubble(); },
  setState(s) { cancelSeq(); setState(s); },
  setMood(md) { if (MOODS[md]) setMood(md); },
  gesture(g) { gesture(g, g === "shake" ? 1.3 : 1.1); },
  wander() { wander(true); },
  setSarcasm(n) { sarcasm = clamp(n | 0, 0, 3); },
  setRemarks(list) { remarks = Array.isArray(list) ? list : []; },
  setReduceMotion(on) { RM = !!on; },
  setQuality(q) { const low = q === "baja"; renderer.setPixelRatio(low ? 1 : Math.min(devicePixelRatio || 1, 2)); bloom.enabled = !low; key.castShadow = !low; dust.visible = !low; resize(); },
};

let last = performance.now();
function frame(now) {
  const dt = clamp((now - last) / 1000, 0, .05); last = now;
  if (dt === 0) { requestAnimationFrame(frame); return; }
  update(dt); pose(); drawEye(); composer.render(); bubbleLayout();
  requestAnimationFrame(frame);
}
new ResizeObserver(resize).observe(stage); resize();
requestAnimationFrame(frame);
</script>
