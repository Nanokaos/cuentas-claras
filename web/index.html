<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0a17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Cuentas Claras</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Saira+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Nave cyberpunk: fondo violeta casi negro, magenta para acciones, verde y ámbar solo para estados. */
  --bg: #0d0a17; --panel: #141020; --raise: #1c1630; --line: #2c2444; --text: #eee9f7; --muted: #a49cbd;
  --accent: #ff4fd8; --accent2: #8c5cff; --ok: #3ddc97; --warn: #ffb347; --bad: #ff5266;
  --display: "Saira Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); font-size: 15px; -webkit-tap-highlight-color: transparent; }
body { padding-bottom: calc(76px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#veraWrap { position: relative; height: min(46vh, 340px); padding-top: env(safe-area-inset-top); background: #07050d; }
#vera { width: 100%; height: 100%; border: 0; display: block; }
#quick { display: flex; gap: 8px; padding: 8px 12px; position: sticky; top: 0; z-index: 5; background: rgba(13, 10, 23, .92); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
#quickForm { flex: 1; display: flex; min-width: 0; }
#quickText { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 24px; padding: 11px 16px; }
.round { width: 46px; height: 46px; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer; flex: none; }
#mic { background: radial-gradient(circle at 35% 30%, #ff8be8, #c22fb0 60%, #7b2bd0); box-shadow: 0 4px 18px rgba(255, 79, 216, .4); color: #fff; }
#mic.live { animation: ring 1.2s ease-out infinite; }
@keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(80, 220, 255, .55); } 100% { box-shadow: 0 0 0 16px rgba(80, 220, 255, 0); } }
#add, #chatBtn { background: var(--raise); border: 1px solid var(--line); font-size: 24px; position: relative; }
#chatBtn.has::after { content: ""; position: absolute; top: 9px; right: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
#quick .round { width: 44px; height: 44px; }
#chat { height: 86vh; display: none; flex-direction: column; gap: 8px; padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
#chat[open] { display: flex; }
.chat-h { display: flex; justify-content: space-between; align-items: center; } .chat-h h3 { margin: 0; color: var(--accent); }
#chatLog { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px 2px; }
.msg { max-width: 86%; padding: 9px 13px; border-radius: 16px; font-size: 14.5px; line-height: 1.42; white-space: pre-wrap; }
.msg.me { align-self: flex-end; background: rgba(255, 79, 216, .16); border: 1px solid rgba(255, 79, 216, .35); border-bottom-right-radius: 4px; }
.msg.vera { align-self: flex-start; background: var(--raise); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg.act { align-self: stretch; max-width: none; background: #1a1430; border: 1px solid var(--accent2); display: flex; flex-direction: column; gap: 4px; }
.msg.act.done { opacity: .6; } .msg.act small { color: var(--muted); }
#chatForm { display: flex; gap: 8px; } #chatText { flex: 1; min-width: 0; background: var(--raise); border: 1px solid var(--line); border-radius: 22px; padding: 11px 14px; font-size: 16px; }
#chatMic { background: radial-gradient(circle at 35% 30%, #ff8be8, #c22fb0 60%, #7b2bd0); color: #fff; width: 44px; height: 44px; } #chatMic.live { animation: ring 1.2s ease-out infinite; }
.send { background: var(--accent); color: #1a0718; width: 44px; height: 44px; font-size: 18px; }
#view { padding: 6px 12px 20px; display: flex; flex-direction: column; gap: 10px; }
h2 { font-family: var(--display); font-weight: 600; font-size: 26px; margin: 8px 0 2px; display: flex; justify-content: space-between; align-items: center; }
h3 { font-family: var(--display); font-weight: 600; font-size: 17px; margin: 0 0 8px; letter-spacing: .02em; }
h4 { font-size: 12.5px; color: var(--muted); margin: 10px 4px 0; font-weight: 500; text-transform: capitalize; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; text-align: left; width: 100%; }
.card.warn { border-color: rgba(255, 179, 71, .45); } .card.warn p { margin: 4px 0; font-size: 14px; }
.label { font-size: 12.5px; color: var(--muted); }
.big { font-family: var(--display); font-weight: 600; font-size: 42px; line-height: 1.05; font-variant-numeric: tabular-nums; margin-top: 2px; }
.mid { font-family: var(--display); font-weight: 600; font-size: 22px; font-variant-numeric: tabular-nums; margin-top: 2px; }
.neg { color: var(--bad); } .pos { color: var(--ok); } .w { color: var(--warn); } .v { color: var(--accent2); }
.sub { font-size: 13px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .small { font-size: 12.5px; }
.demo { color: var(--warn); font-size: 13px; margin: 4px 2px; }
.tiles { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
details { margin-top: 10px; } summary { color: var(--accent2); font-size: 13.5px; cursor: pointer; }
.line { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; padding: 3px 0; font-variant-numeric: tabular-nums; }
.line.RESULTADO { font-weight: 600; border-top: 1px solid var(--line); padding-top: 6px; } .line.NOTA { color: var(--muted); }
.cat { margin-bottom: 12px; } .cat:last-child { margin-bottom: 0; }
.sub-b { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; } .sub-b b { color: var(--text); font-weight: 500; } .sub-b b.neg { color: var(--bad); }
.link.file input, .btn.file input { display: none; }
.cat-h { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 3px; background: var(--raise); overflow: hidden; margin: 5px 0 3px; }
.bar i { display: block; height: 100%; background: var(--ok); border-radius: 3px; } .bar i.w { background: var(--warn); } .bar i.bad { background: var(--bad); }
.pill { font-style: normal; font-size: 11px; padding: 1px 8px; border-radius: 999px; background: rgba(255, 179, 71, .15); } .pill.bad { background: rgba(255, 82, 102, .15); color: var(--bad); }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; background: none; border: 0; padding: 8px 0; text-align: left; cursor: pointer; font-variant-numeric: tabular-nums; }
.card.row { padding: 14px 16px; background: var(--panel); border: 1px solid var(--line); }
.row b { font-weight: 500; display: block; } .row small { display: block; font-size: 12.5px; color: var(--muted); margin-top: 1px; } .row small.w { color: var(--warn); } .row small.v { color: var(--accent2); }
.card.tx { padding: 4px 16px; } .card.tx .link { margin: -2px 0 8px; }
.link { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 4px 0; font-size: 14px; }
.search { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 11px 14px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 7px 14px; cursor: pointer; font-size: 14px; }
.chip.on { border-color: var(--accent); background: rgba(255, 79, 216, .14); }
.fab { position: fixed; right: max(18px, calc(50% - 262px)); bottom: calc(92px + env(safe-area-inset-bottom)); width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--accent); color: #1a0718; font-size: 30px; box-shadow: 0 6px 20px rgba(255, 79, 216, .4); cursor: pointer; }
.form { display: flex; flex-direction: column; gap: 10px; }
.form label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
.form input:not([type=checkbox]):not([type=range]):not([type=file]), .form select { background: var(--raise); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; color: var(--text); font-size: 16px; width: 100%; }
.form .sw { flex-direction: row; justify-content: space-between; align-items: center; color: var(--text); font-size: 15px; }
.form .sw small { display: block; color: var(--muted); font-size: 12.5px; }
input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--accent); flex: none; } input[type=range] { accent-color: var(--accent); }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.btn { border: 1px solid var(--accent); background: var(--accent); color: #1a0718; font-weight: 600; border-radius: 999px; padding: 11px 20px; cursor: pointer; text-align: center; }
.btn.ghost { background: var(--raise); border-color: var(--line); color: var(--text); font-weight: 500; }
.btn.danger { background: none; border-color: var(--bad); color: var(--bad); }
.btn.file input { display: none; }
fieldset { border: 1px solid var(--line); border-radius: 14px; padding: 10px; margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.two > *, .form label { min-width: 0; }
.form input, .form select { max-width: 100%; }
dialog { width: 100%; max-width: 560px; left: 0; right: 0; overflow-x: hidden; max-height: 88dvh; margin: auto auto 0; border: 1px solid var(--line); border-bottom: 0; border-radius: 22px 22px 0 0; background: var(--panel); color: var(--text); padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); overflow-y: auto; }
dialog .actions { position: sticky; bottom: calc(-18px - env(safe-area-inset-bottom)); background: var(--panel); padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); margin-bottom: calc(-18px - env(safe-area-inset-bottom)); z-index: 2; }
#chat .actions { position: static; margin: 0; padding: 4px 0 0; background: none; }
dialog::backdrop { background: rgba(5, 3, 10, .7); }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: grid; grid-template-columns: repeat(5, 1fr); max-width: 560px; margin: 0 auto; background: #0f0c1a; border-top: 1px solid var(--line); padding: 6px 4px calc(8px + env(safe-area-inset-bottom)); }
.tabs a { display: grid; justify-items: center; gap: 2px; color: var(--muted); text-decoration: none; font-size: 10.5px; padding: 4px 0; }
.tabs a.on { color: var(--accent); } .tabs svg { width: 22px; height: 22px; }
#toast { position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); opacity: 0; transition: .25s; background: var(--raise); border: 1px solid var(--line); border-radius: 14px; padding: 10px 16px; max-width: 90vw; font-size: 14px; z-index: 30; pointer-events: none; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.form [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="veraWrap"><iframe id="vera" src="vera.html" title="Vera, la asistente" allow="autoplay"></iframe></div>
<div id="quick">
  <form id="quickForm"><input id="quickText" placeholder="«23 € en el súper con tarjeta»" autocomplete="off" enterkeyhint="send" aria-label="Escribe un gasto o ingreso"></form>
  <button class="round" id="mic" aria-label="Dictar un gasto"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  <button class="round" id="chatBtn" aria-label="Conversación con Vera"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 5h16v11H9l-5 4z"/></svg></button>
  <button class="round" id="add" aria-label="Añadir movimiento">+</button>
</div>
<main id="view"></main>
<nav class="tabs" aria-label="Secciones">
  <a href="#inicio" data-tab="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</a>
  <a href="#movimientos" data-tab="movimientos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Movimientos</a>
  <a href="#presupuestos" data-tab="presupuestos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 4v8l6 4"/></svg>Presupuestos</a>
  <a href="#cuentas" data-tab="cuentas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/></svg>Cuentas</a>
  <a href="#ajustes" data-tab="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-2.7-1.1l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3.6 15H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.1-2.7l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 9.7 4V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1.3z"/></svg>Ajustes</a>
</nav>
<dialog id="chat" aria-label="Conversación con Vera">
  <div class="chat-h"><h3>Vera</h3><button class="link" id="chatClose">Cerrar</button></div>
  <div id="chatLog"></div>
  <form id="chatForm"><input id="chatText" placeholder="Pregunta o pide un cambio…" autocomplete="off" enterkeyhint="send" aria-label="Mensaje para Vera">
    <button type="button" class="round" id="chatMic" aria-label="Dictar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <button class="round send" aria-label="Enviar">➤</button></form>
</dialog>
<input type="file" id="bankPick" class="bankFile" accept=".pdf,.xlsx,.xls,.ods,.csv,application/pdf" hidden>
<dialog id="sheet"><div id="sheetBody"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
