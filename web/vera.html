  const v = (q || "0.35,0.1,1.25,0,0,0").split(",").map(Number); return { off: new THREE.Vector3(v[0], v[1], v[2]), look: new THREE.Vector3(v[3] || 0, v[4] || 0, v[5] || 0) }; })();

function bubbleLayout() {
  if (!bubble.classList.contains("show")) return;
  const h = headScreen(), right = h.x < W / 2, gap = h.r * 1.35 + 12;
  const width = clamp(right ? W - (h.x + gap) - 12 : h.x - gap - 12, 160, 250);
  bubble.style.width = width + "px";
  bubble.style.left = (right ? Math.min(h.x + gap, W - width - 8) : Math.max(8, h.x - gap - width)) + "px";
  const bh = bubble.offsetHeight; bubble.style.top = clamp(h.y - bh * .45, 10, H - bh - 10) + "px";
}


// ================= API para la app =================
window.vera = {
  speak(text, mood = "neutral", st = "habla", actions = null) { cancelSeq(); interact(); fromApp = true; speak(text, { mood, state: st, actions }); },
  show(text) { showRaw(text); }, hide() { hideBubble(); },
  setState(s) { cancelSeq(); setState(s); }, setMood(md) { if (MOODS[md]) setMood(md); },
  gesture(g) { gesture(g, g === "shake" ? 1.3 : 1.1); }, wander() { wander(true); },
  setSarcasm(n) { sarcasm = clamp(n | 0, 0, 4); }, setRemarks(list) { remarks = Array.isArray(list) ? list : []; },
  setReduceMotion(on) { RM = !!on; },
  /** Va a un punto del raíl y se queda ahí como puesto (deja de pasear un rato). */
  goTo(x, hold = 20) { const t = clamp(+x || 0, G.minX, G.maxX); G.home = t; P.ttx = t; nextWander = clock + hold; },
  setQuality(q) { const low = q === "baja"; renderer.setPixelRatio(low ? 1 : Math.min(devicePixelRatio || 1, 2)); bloom.enabled = !low; key.castShadow = !low; dust.visible = !low; resize(); },
};

let last = performance.now();
function frame(now) {
  const dt = clamp((now - last) / 1000, 0, .05); last = now;
  if (dt === 0) { requestAnimationFrame(frame); return; }
  update(dt); pose(); drawEye(); composer.render(); bubbleLayout(); window.__frames = (window.__frames || 0) + 1;
  requestAnimationFrame(frame);
}
new ResizeObserver(resize).observe(stage); resize(); parent.postMessage({ vera: "ready" }, "*");
requestAnimationFrame(frame);
</script>
